[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
site_url = "https://blitzbz1.github.io/TTPortal"
jwt_expiry = 3600
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true

[functions.healthz]
verify_jwt = false

# Crash reports must arrive from signed-out users too (T080); payloads are
# capped server-side and the anon key is still required.
[functions.ingest-telemetry]
verify_jwt = false
