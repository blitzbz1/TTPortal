# Smoke: F023 direct messages — open the Messages inbox, open a thread, send a
# message. Destructive (writes a DM). Run against the local stack, NOT prod.
# testID-first per the .maestro conventions.
appId: com.ttportal.app
---
- launchApp:
    clearState: false
- runFlow: helpers/ensure_logged_in.yaml

- tapOn:
    id: "open-messages-btn"
- extendedWaitUntil:
    visible:
      id: "venue-list"   # any subsequent screen marker; replaced below
    timeout: 1000
    optional: true

# Open the first existing thread (seeded test data) and send a message.
- tapOn:
    id: "dm-thread-0"
    optional: true
- runFlow:
    when:
      visible:
        id: "dm-input"
    commands:
      - tapOn:
          id: "dm-input"
      - inputText: "hello from maestro"
      - hideKeyboard
      - tapOn:
          id: "dm-send"
      - extendedWaitUntil:
          visible: "hello from maestro"
          timeout: 8000
