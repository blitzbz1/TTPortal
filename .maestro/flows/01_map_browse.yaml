# Smoke: map browsing — search filter, chip filters, list rows. Read-only.
appId: com.ttportal.app
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Explore Berlin"
    commands:
      - tapOn: "Explore Berlin"
- extendedWaitUntil:
    visible: "TTPortal"
    timeout: 25000
# Self-right: a previous flow may have left the app on another tab.
- tapOn:
    text: "Map"
    optional: true
- waitForAnimationToEnd
# Chip filters
- tapOn: "Parks"
- waitForAnimationToEnd
- tapOn: "Indoor"
- waitForAnimationToEnd
- tapOn: "All"
# Search narrows the LIST (not the map markers — T041)
- tapOn: "Search venues..."
- inputText: "str"
- waitForAnimationToEnd:
    timeout: 2000
- hideKeyboard
- assertVisible: "TTPortal"
